<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WordLoop</title>
</head>
<body>
  <h1>WordLoop</h1>
  <ul id="list"></ul>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxoGgqpoY30TjU2XTUgIGDswn3EFBLrJSKO488ya63dNPsdtPggh_aJKHI1Ecq57dadjQ/exec';
    fetch(API_URL)
      .then(res => res.json())
      .then(cards => {
        const list = document.getElementById('list');
        cards.forEach(c => {
          const li = document.createElement('li');
          li.textContent = c.word + ' : ' + c.meaning;
          list.appendChild(li);
        });
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
